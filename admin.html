<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<title>Admin | Edlan Builders and Suppliers</title>
<link rel="icon" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   EDLAN BUILDERS AND SUPPLIERS — Stylesheet
   Design language: "blueprint & roofline" — drawn from the company logo's
   glazed roof-truss mark. Navy + magenta + construction-green + gold glass
   trim, set against warm blueprint-cream, with a mono "drafting" type used
   for plan dimensions and labels.
   ========================================================================== */

:root {
  color-scheme: light;

  /* ---- Color tokens (from the Edlan logo) ---- */
  --navy: #1b2a6e;
  --navy-dark: #0e1740;
  --magenta: #e0117a;
  --magenta-dark: #a80c5c;
  --green-start: #7ec242;
  --green-end: #dcefc0;
  --gold: #f0d675;
  --gold-soft: #f8e9ad;
  --amber: #d99a2b;
  --amber-dark: #b87d1c;
  --amber-light: #f0c268;
  --sky: #56c6f5;
  --cream: #faf8f2;
  --cream-dim: #f1ede1;
  --charcoal: #171a20;
  --ink-soft: #4a4e57;
  --white: #ffffff;

  /* ---- Type ---- */
  --font-display: 'Poppins', 'Segoe UI', sans-serif;
  --font-body: 'Inter', 'Segoe UI', sans-serif;
  --font-mono: 'Roboto Mono', 'Courier New', monospace;

  /* ---- Layout ---- */
  --max-width: 1200px;
  --radius: 10px;
  --shadow-soft: 0 10px 30px rgba(14, 23, 64, 0.12);
  --shadow-glow: 0 0 24px rgba(240, 214, 117, 0.55);
}

* { box-sizing: border-box; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: var(--font-body);
  color: var(--charcoal);
  background: var(--cream);
  line-height: 1.6;
  overflow-x: hidden;
}

h1, h2, h3, h4 {
  font-family: var(--font-display);
  margin: 0 0 0.5em;
  line-height: 1.15;
  color: var(--navy);
}

p { margin: 0 0 1em; }

a { color: inherit; text-decoration: none; }

img { max-width: 100%; display: block; }

.container {
  width: 100%;
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0 24px;
}

.eyebrow {
  font-family: var(--font-mono);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-size: 0.75rem;
  color: var(--magenta);
  font-weight: 700;
  display: inline-block;
  margin-bottom: 10px;
}

.blueprint-tick {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--sky);
  opacity: 0.85;
}

/* ==========================================================================
   BUTTONS — glowing, glass-roof inspired
   ========================================================================== */

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 0.95rem;
  padding: 14px 28px;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
  white-space: nowrap;
}

.btn-primary {
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold-soft) 100%);
  color: var(--navy-dark);
  box-shadow: 0 0 0 rgba(240, 214, 117, 0);
}
.btn-primary:hover {
  box-shadow: var(--shadow-glow);
  transform: translateY(-2px);
}

.btn-outline {
  background: transparent;
  color: var(--white);
  border: 2px solid var(--sky);
  box-shadow: 0 0 0 rgba(86, 198, 245, 0);
}
.btn-outline:hover {
  box-shadow: 0 0 20px rgba(86, 198, 245, 0.6);
  transform: translateY(-2px);
}

.btn-magenta {
  background: linear-gradient(135deg, var(--magenta) 0%, var(--magenta-dark) 100%);
  color: var(--white);
}
.btn-magenta:hover {
  box-shadow: 0 0 22px rgba(224, 17, 122, 0.55);
  transform: translateY(-2px);
}

.btn-block { width: 100%; justify-content: center; }

/* ==========================================================================
   HEADER / NAV
   ========================================================================== */

.site-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 500;
  background: rgba(255, 255, 255, 0.97);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(27, 42, 110, 0.08);
  box-shadow: 0 2px 16px rgba(27, 42, 110, 0.07);
  transition: box-shadow 0.3s ease;
}

.nav-wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 24px;
  max-width: var(--max-width);
  margin: 0 auto;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand img {
  height: 46px;
  width: auto;
  filter: drop-shadow(0 0 8px rgba(240, 214, 117, 0.45));
}
.brand-text {
  display: flex;
  flex-direction: column;
  line-height: 1.1;
}
.brand-text strong {
  font-family: var(--font-display);
  color: var(--navy);
  font-size: 1.05rem;
  letter-spacing: 0.02em;
}
.brand-text span {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  color: var(--magenta);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.nav-links {
  display: flex;
  gap: 30px;
  list-style: none;
  margin: 0;
  padding: 0;
}
.nav-links a {
  color: var(--navy);
  font-weight: 500;
  font-size: 0.92rem;
  position: relative;
  padding: 6px 2px;
}
.nav-links a::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -2px;
  width: 0%;
  height: 2px;
  background: var(--amber);
  transition: width 0.25s ease;
}
.nav-links a:hover::after,
.nav-links a.active::after { width: 100%; }
.nav-links a.active { color: var(--amber-dark); }

.nav-cta {
  display: flex;
  align-items: center;
  gap: 12px;
}
.nav-call {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--navy);
  font-family: var(--font-mono);
  font-size: 0.85rem;
  border: 1px solid rgba(27,42,110,0.15);
  padding: 8px 14px;
  border-radius: 999px;
  background: var(--cream);
  transition: box-shadow 0.25s ease, border-color 0.25s ease;
}
.nav-call:hover {
  border-color: var(--sky);
  box-shadow: 0 0 14px rgba(86, 198, 245, 0.35);
}

.btn-quote {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 0.85rem;
  color: #3a2405;
  background: linear-gradient(135deg, var(--amber) 0%, var(--amber-light) 100%);
  padding: 10px 20px;
  border-radius: 999px;
  box-shadow: 0 4px 14px rgba(227, 168, 63, 0.4);
  transition: transform 0.25s ease, box-shadow 0.25s ease;
  white-space: nowrap;
}
.btn-quote:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 22px rgba(227, 168, 63, 0.55);
}

.nav-toggle {
  display: none;
  flex-direction: column;
  gap: 5px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 6px;
}
.nav-toggle span {
  width: 26px;
  height: 2px;
  background: var(--navy);
  border-radius: 2px;
}

@media (max-width: 900px) {
  .nav-links { display: none; }
  .nav-call span.call-label { display: none; }
  .nav-toggle { display: flex; }
  .nav-links.open {
    display: flex;
    flex-direction: column;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: var(--white);
    padding: 20px 24px;
    gap: 18px;
    border-bottom: 2px solid var(--amber);
    box-shadow: 0 12px 24px rgba(27,42,110,0.12);
  }
}

/* ==========================================================================
   HERO / SLIDESHOW
   ========================================================================== */

.hero {
  position: relative;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: var(--navy-dark);
}

.slideshow {
  position: absolute;
  inset: 0;
  z-index: 0;
}
.slide {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  opacity: 0;
  transition: opacity 1.6s ease-in-out;
}
.slide.active { opacity: 1; }

.hero-video {
  position: absolute;
  inset: 0;
  z-index: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.4;
  animation: heroVideoZoom 24s ease-in-out infinite alternate;
}
@keyframes heroVideoZoom {
  0% { transform: scale(1); }
  100% { transform: scale(1.08); }
}
@media (prefers-reduced-motion: reduce) {
  .hero-video { animation: none; }
}

.hero-overlay {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(180deg, rgba(14,23,64,0.72) 0%, rgba(14,23,64,0.55) 45%, rgba(14,23,64,0.92) 100%),
    repeating-linear-gradient(0deg, rgba(86,198,245,0.05) 0px, rgba(86,198,245,0.05) 1px, transparent 1px, transparent 40px),
    repeating-linear-gradient(90deg, rgba(86,198,245,0.05) 0px, rgba(86,198,245,0.05) 1px, transparent 1px, transparent 40px);
  z-index: 1;
}

.hero-content {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 160px 24px 90px;
  max-width: 880px;
}

.hero-logo {
  max-width: 300px;
  margin: 0 auto 28px;
  filter: drop-shadow(0 0 26px rgba(240, 214, 117, 0.65)) drop-shadow(0 0 50px rgba(86, 198, 245, 0.35));
  animation: logoFloat 5s ease-in-out infinite;
}

@keyframes logoFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.hero h1 {
  color: var(--white);
  font-size: clamp(2rem, 5vw, 3.4rem);
  font-weight: 700;
  margin-bottom: 14px;
}
.hero h1 em {
  font-style: italic;
  color: var(--gold);
  font-weight: 600;
}

.hero p.lead {
  color: #e7ecf7;
  font-size: 1.15rem;
  max-width: 640px;
  margin: 0 auto 34px;
}

.hero-actions {
  display: flex;
  gap: 18px;
  justify-content: center;
  flex-wrap: wrap;
}

.hero-scroll {
  position: relative;
  z-index: 2;
  color: var(--sky);
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  opacity: 0.85;
  margin-top: 30px;
}
.hero-scroll .chevron {
  width: 10px;
  height: 10px;
  border-right: 2px solid var(--sky);
  border-bottom: 2px solid var(--sky);
  transform: rotate(45deg);
  animation: chevronBounce 1.8s ease-in-out infinite;
}
@keyframes chevronBounce {
  0%, 100% { transform: rotate(45deg) translate(0,0); opacity: 0.4; }
  50% { transform: rotate(45deg) translate(4px,4px); opacity: 1; }
}

@media (max-width: 900px) {
  .hero { min-height: 50vh; }
  .hero-content { padding: 78px 18px 34px; }
  .hero-logo { max-width: 130px; margin-bottom: 10px; }
  .hero h1 { font-size: 1.35rem; margin-bottom: 6px; }
  .hero p.lead { font-size: 0.82rem; margin-bottom: 14px; line-height: 1.4; }
  .hero-actions { gap: 10px; }
  .hero-actions .btn { padding: 9px 16px; font-size: 0.78rem; }
  .hero-scroll { margin-top: 16px; }
}

.slide-dots {
  position: absolute;
  bottom: 70px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  display: flex;
  gap: 10px;
}
.slide-dots button {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  border: 1px solid var(--gold);
  background: transparent;
  cursor: pointer;
  padding: 0;
  transition: background 0.3s ease, box-shadow 0.3s ease;
}
.slide-dots button.active {
  background: var(--gold);
  box-shadow: 0 0 10px rgba(240, 214, 117, 0.8);
}

/* ==========================================================================
   ROOFLINE DIVIDER — signature element (blueprint truss line)
   ========================================================================== */

.roofline {
  position: relative;
  z-index: 3;
  display: block;
  width: 100%;
  height: auto;
  margin-bottom: -2px;
}
.roofline.flip { transform: rotate(180deg); }

/* ==========================================================================
   SECTIONS (generic)
   ========================================================================== */

section { position: relative; }

.section {
  padding: 90px 0;
}
.section-cream { background: var(--cream); }
.section-dim { background: var(--cream-dim); }
.section-navy {
  background: linear-gradient(160deg, var(--navy-dark) 0%, var(--navy) 100%);
  color: var(--white);
}
.section-navy h2, .section-navy h3 { color: var(--white); }

.section-head {
  text-align: center;
  max-width: 720px;
  margin: 0 auto 56px;
}
.section-head h2 { font-size: clamp(1.7rem, 3.5vw, 2.4rem); }
.section-head p { color: var(--ink-soft); font-size: 1.05rem; }
.section-navy .section-head p { color: #d6def0; }

/* ==========================================================================
   SERVICES GRID
   ========================================================================== */

.services-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
  gap: 26px;
}

.service-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 32px 26px;
  box-shadow: var(--shadow-soft);
  border-top: 4px solid var(--gold);
  position: relative;
  overflow: hidden;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.service-card::before {
  content: "";
  position: absolute;
  top: -60px;
  right: -60px;
  width: 140px;
  height: 140px;
  background: radial-gradient(circle, rgba(86,198,245,0.18) 0%, transparent 70%);
  border-radius: 50%;
}
.service-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 16px 40px rgba(27, 42, 110, 0.2);
  border-top-color: var(--sky);
}
.service-icon {
  width: 54px;
  height: 54px;
  margin-bottom: 18px;
  color: var(--navy);
}
.service-card h3 {
  font-size: 1.1rem;
  margin-bottom: 10px;
}
.service-card p {
  color: var(--ink-soft);
  font-size: 0.94rem;
  margin-bottom: 0;
}
.service-tag {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  color: var(--magenta);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  display: block;
  margin-bottom: 8px;
}

.service-detail {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
  align-items: center;
  padding: 70px 0;
  border-bottom: 1px dashed rgba(27,42,110,0.15);
}
.service-detail:last-child { border-bottom: none; }
.service-detail.reverse .service-detail-media { order: 2; }
.service-detail-media {
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow-soft);
  position: relative;
  aspect-ratio: 4/3;
}
.service-detail-media img { width: 100%; height: 100%; object-fit: cover; }
.service-detail h3 { font-size: 1.5rem; }
.service-detail ul {
  padding-left: 20px;
  color: var(--ink-soft);
  margin: 18px 0 0;
}
.service-detail li { margin-bottom: 8px; }

@media (max-width: 800px) {
  .service-detail, .service-detail.reverse .service-detail-media {
    grid-template-columns: 1fr;
    order: 0;
  }
  .service-detail { grid-template-columns: 1fr; }
}

/* ==========================================================================
   PLACEHOLDER PHOTO BLOCKS (swap for real photography)
   ========================================================================== */

.photo-placeholder {
  width: 100%;
  height: 100%;
  min-height: 220px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 8px;
  color: var(--navy);
  font-family: var(--font-mono);
  font-size: 0.75rem;
  text-align: center;
  padding: 20px;
  background:
    linear-gradient(135deg, rgba(126,194,66,0.18), rgba(86,198,245,0.18)),
    repeating-linear-gradient(45deg, rgba(27,42,110,0.06) 0, rgba(27,42,110,0.06) 2px, transparent 2px, transparent 14px),
    var(--cream-dim);
}
.photo-placeholder svg { width: 40px; height: 40px; opacity: 0.6; }

/* ==========================================================================
   ABOUT / STATS
   ========================================================================== */

.about-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 60px;
  align-items: center;
}
@media (max-width: 860px) {
  .about-grid { grid-template-columns: 1fr; }
}

.stats-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 20px;
  margin-top: 34px;
}
.stat-box {
  text-align: center;
  padding: 18px 10px;
  border-left: 3px solid var(--gold);
}
.stat-box strong {
  display: block;
  font-family: var(--font-display);
  font-size: 1.9rem;
  color: var(--navy);
}
.section-navy .stat-box strong { color: var(--gold); }
.stat-box span {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-soft);
}
.section-navy .stat-box span { color: #cdd7ef; }

.process-steps {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 24px;
  counter-reset: step;
}
.process-step {
  position: relative;
  padding: 26px 22px 22px;
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: var(--shadow-soft);
}
.process-step::before {
  counter-increment: step;
  content: counter(step, decimal-leading-zero);
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: var(--white);
  background: var(--magenta);
  padding: 4px 10px;
  border-radius: 999px;
  display: inline-block;
  margin-bottom: 14px;
}

/* ==========================================================================
   TESTIMONIALS
   ========================================================================== */

.testimonial-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 24px;
}
.testimonial-card {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(240,214,117,0.25);
  border-radius: var(--radius);
  padding: 28px;
}
.testimonial-card p { font-style: italic; color: #eef1f8; }
.testimonial-name {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: var(--gold);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

/* ==========================================================================
   CONTACT
   ========================================================================== */

.contact-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 50px;
}
@media (max-width: 900px) {
  .contact-grid { grid-template-columns: 1fr; }
}

.contact-cards {
  display: grid;
  gap: 18px;
}
.contact-card {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  background: var(--white);
  padding: 22px;
  border-radius: var(--radius);
  box-shadow: var(--shadow-soft);
  border-left: 4px solid var(--sky);
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}
.contact-card:hover {
  transform: translateX(4px);
  box-shadow: 0 14px 34px rgba(27,42,110,0.18);
}
.contact-card .icon {
  width: 42px;
  height: 42px;
  flex-shrink: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--green-start), var(--green-end));
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--navy-dark);
}
.contact-card .icon svg { width: 20px; height: 20px; }
.contact-card h4 { margin-bottom: 4px; font-size: 1rem; }
.contact-card p { margin-bottom: 0; color: var(--ink-soft); font-size: 0.94rem; }
.contact-card a.value {
  color: var(--navy);
  font-weight: 600;
  word-break: break-word;
}
.contact-card a.value:hover { color: var(--magenta); }

.map-wrap {
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow-soft);
  border: 3px solid var(--white);
  outline: 2px solid var(--gold-soft);
}
.map-wrap iframe {
  width: 100%;
  height: 320px;
  border: 0;
  display: block;
}

.contact-form {
  background: var(--white);
  padding: 34px;
  border-radius: var(--radius);
  box-shadow: var(--shadow-soft);
}
.form-row { margin-bottom: 18px; }
.form-row label {
  display: block;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--navy);
  margin-bottom: 6px;
}
.form-row input,
.form-row select,
.form-row textarea {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid #dfe2ea;
  border-radius: 8px;
  font-family: var(--font-body);
  font-size: 0.95rem;
  background: var(--cream);
  transition: border-color 0.25s ease, box-shadow 0.25s ease;
}
.form-row input:focus,
.form-row select:focus,
.form-row textarea:focus {

}
.form-note {

/* ==========================================================================

   ========================================================================== */

.cta-band {

.cta-band h2 { color: var(--navy-dark); margin-bottom: 10px; }

/* ==========================================================================
   FOOTER
   ========================================================================== */

.site-footer {

  padding: 60px 0 24px;
}
.footer-grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr;

}
@media (max-width: 800px) {

}
.footer-brand { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
.footer-brand img { height: 50px; }
.footer-brand strong { color: var(--white); font-family: var(--font-display); font-size: 1.2rem; }
.footer-brand span { display: block; font-style: italic; color: var(--gold); font-size: 0.85rem; }

/* ==========================================================================
   FLOATING WHATSAPP BUTTON
   ========================================================================== */

.whatsapp-float {
  position: fixed;
  bottom: 26px;
  right: 26px;
  z-index: 400;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--green-start), #4ea024);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 6px 20px rgba(78, 160, 36, 0.5);
  animation: waPulse 2.6s ease-in-out infinite;
}
.whatsapp-float svg { width: 28px; height: 28px; fill: var(--white); }
@keyframes waPulse {
  0%, 100% { box-shadow: 0 6px 20px rgba(78,160,36,0.5); }
  50% { box-shadow: 0 6px 30px rgba(78,160,36,0.85), 0 0 0 10px rgba(78,160,36,0.08); }
}

.facebook-float {
  position: fixed;
  bottom: 96px;
  right: 26px;
  z-index: 400;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: linear-gradient(135deg, #1877f2, #0d5cd1);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 6px 20px rgba(24, 119, 242, 0.5);
  animation: fbPulse 2.6s ease-in-out infinite;
  animation-delay: 1.3s;
}
.facebook-float svg { width: 26px; height: 26px; fill: var(--white); }
@keyframes fbPulse {
  0%, 100% { box-shadow: 0 6px 20px rgba(24,119,242,0.5); }
  50% { box-shadow: 0 6px 30px rgba(24,119,242,0.85), 0 0 0 10px rgba(24,119,242,0.08); }
}

/* ==========================================================================
   PAGE HERO (interior pages)
   ========================================================================== */

.page-hero {
  background: linear-gradient(160deg, var(--navy-dark) 0%, var(--navy) 100%);
  padding: 150px 0 80px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.page-hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(0deg, rgba(86,198,245,0.06) 0px, rgba(86,198,245,0.06) 1px, transparent 1px, transparent 36px),
    repeating-linear-gradient(90deg, rgba(86,198,245,0.06) 0px, rgba(86,198,245,0.06) 1px, transparent 1px, transparent 36px);
}
.page-hero h1 { color: var(--white); position: relative; font-size: clamp(1.9rem, 4vw, 2.8rem); }
.page-hero p { color: #d6def0; position: relative; max-width: 640px; margin: 0 auto; }
.breadcrumb {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--sky);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  position: relative;
  margin-bottom: 14px;
}
.breadcrumb a { color: var(--sky); }
.breadcrumb span { color: var(--gold); }

/* ==========================================================================
   LOADING OVERLAY — logo used as the loading indicator
   ========================================================================== */

.load-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: radial-gradient(circle at center, var(--navy) 0%, var(--navy-dark) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s ease;
}
.load-overlay.show { opacity: 1; pointer-events: all; }
.load-ring-wrap {
  position: relative;
  width: 160px;
  height: 160px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.load-ring-wrap img {
  width: 96px;
  height: auto;
  z-index: 2;
  animation: loadPulse 1.1s ease-in-out infinite;
}
.load-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 3px solid rgba(240, 214, 117, 0.18);
  border-top-color: var(--gold);
  border-right-color: var(--sky);
  animation: loadSpin 1.1s linear infinite;
}
@keyframes loadSpin { to { transform: rotate(360deg); } }
@keyframes loadPulse {
  0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(240,214,117,0.5)); }
  50% { transform: scale(1.08); filter: drop-shadow(0 0 22px rgba(240,214,117,0.85)); }
}
.load-text {
  position: absolute;
  bottom: -34px;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--sky);
  white-space: nowrap;
}

/* ==========================================================================
   SCROLL REVEAL
   ========================================================================== */

.reveal {
  opacity: 0;
  transform: translateY(28px);
  transition: opacity 0.7s ease, transform 0.7s ease;
}
.reveal.in-view { opacity: 1; transform: translateY(0); }

/* ==========================================================================
   MISC
   ========================================================================== */

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
@media (max-width: 800px) { .grid-2 { grid-template-columns: 1fr; } }

.badge-row {

}

  background: rgba(255,255,255,0.08);

}



/* ---- Admin-page-specific styles ---- */

  z-index: 500;

  border-bottom: 1px solid rgba(27,42,110,0.08);

}
.admin-header .brand { display: flex; align-items: center; gap: 10px; }
.admin-header .brand img { height: 40px; }
.admin-header .brand strong { font-family: var(--font-display); color: var(--navy); }
.admin-header .brand span {

  color: var(--magenta);

.admin-item {
  display: flex;

  box-shadow: var(--shadow-soft);

.btn-sm {
  padding: 8px 16px;
  font-size: 0.8rem;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  font-family: var(--font-display);
  font-weight: 600;
}
.btn-approve { background: linear-gradient(135deg, var(--green-start), #4ea024); color: #fff; }
.btn-reject { background: #f2f2f2; color: var(--charcoal); border: 1px solid #ddd; }
.btn-remove { background: #fde8ee; color: var(--magenta-dark); border: 1px solid rgba(224,17,122,0.3); }

  font-family: var(--font-mono);
  font-size: 0.85rem;
  color: var(--ink-soft);
  padding: 20px 0;
}
</style>
</head>
<body>

<div class="bg-logo-glow" aria-hidden="true">
  <img src="images/logo.png" alt="">
</div>

<header class="admin-header">
  <div class="brand">
    <img src="images/logo.png" alt="Edlan logo">
    <div>
      <strong>EDLAN Admin</strong>
      <span>Photo &amp; Video Uploads</span>
    </div>
  </div>
  <button class="btn btn-outline" id="logoutBtn" style="display:none; color:var(--navy); border-color:var(--navy);">Log Out</button>
</header>

<!-- ===================== LOGIN VIEW ===================== -->
<div id="loginView" class="admin-login-wrap">
  <span class="eyebrow">Admin Access</span>
  <h2 style="margin-bottom:20px;">Log in</h2>
  <form id="loginForm">
    <div class="form-row">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" required>
    </div>
    <div class="form-row">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Log In</button>
    <p class="login-error" id="loginError">Incorrect email or password.</p>
  </form>
</div>

<!-- ===================== ADMIN VIEW ===================== -->
<main class="admin-main" id="adminView" style="display:none;">

  <div class="admin-section">
    <span class="eyebrow">Upload</span>
    <h2>Add a photo or video</h2>
    <form id="uploadForm" class="contact-form" style="padding:26px;">
      <div class="form-row">
        <label for="mediaFile">Photos or videos (you can select several at once)</label>
        <input type="file" id="mediaFile" accept="image/*,video/*" multiple required>
      </div>
      <div class="form-row">
        <label for="caption">Caption (used for all files selected above)</label>
        <textarea id="caption" rows="3" placeholder="e.g. 5-bedroom mansion in Kiamunyi — completed August 2026" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="uploadBtn">Upload for Review</button>
      <p class="upload-status" id="uploadStatus"></p>
    </form>
  </div>

  <div class="admin-section">
    <span class="eyebrow">Awaiting Your Approval</span>
    <h2>Pending review</h2>
    <div id="pendingList"><p class="empty-note">Loading…</p></div>
  </div>

  <div class="admin-section">
    <span class="eyebrow">Live on the Site</span>
    <h2>Published to "Our Work"</h2>
    <div id="approvedList"><p class="empty-note">Loading…</p></div>
  </div>

</main>

<!-- Firebase (compat SDK — simplest for a plain script tag, no build step) -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

<script>
  // ---- Firebase project config ----
  const firebaseConfig = {
    apiKey: "AIzaSyC02FQftOc1jzquVzjMHwNlPz6QjlxXzA4",
    authDomain: "edlan-builders-and-suppliers.firebaseapp.com",
    projectId: "edlan-builders-and-suppliers",
    storageBucket: "edlan-builders-and-suppliers.firebasestorage.app",
    messagingSenderId: "147064657079",
    appId: "1:147064657079:web:9d3c5ce63abcca47ce6932"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // ---- Cloudinary config ----
  const CLOUD_NAME = "isg1ojnd";
  const UPLOAD_PRESET = "edlan-work";

  const loginView = document.getElementById('loginView');
  const adminView = document.getElementById('adminView');
  const logoutBtn = document.getElementById('logoutBtn');

  // ---- Auth state ----
  auth.onAuthStateChanged(function (user) {
    if (user) {
      loginView.style.display = 'none';
      adminView.style.display = 'block';
      logoutBtn.style.display = 'inline-flex';
      startListeners();
    } else {
      loginView.style.display = 'block';
      adminView.style.display = 'none';
      logoutBtn.style.display = 'none';
    }
  });

  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errorEl = document.getElementById('loginError');
    errorEl.style.display = 'none';
    auth.signInWithEmailAndPassword(email, password).catch(function (err) {
      errorEl.textContent = err.message;
      errorEl.style.display = 'block';
    });
  });

  logoutBtn.addEventListener('click', function () { auth.signOut(); });

  // ---- Upload (supports multiple files in one go) ----
  function uploadOneFile(file, caption) {
    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', UPLOAD_PRESET);

    return fetch('https://api.cloudinary.com/v1_1/' + CLOUD_NAME + '/auto/upload', {
      method: 'POST',
      body: formData
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.error) throw new Error(data.error.message);
        return db.collection('gallery').add({
          url: data.secure_url,
          publicId: data.public_id,
          resourceType: data.resource_type,
          caption: caption,
          status: 'pending',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      });
  }

  document.getElementById('uploadForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const fileInput = document.getElementById('mediaFile');
    const captionInput = document.getElementById('caption');
    const statusEl = document.getElementById('uploadStatus');
    const btn = document.getElementById('uploadBtn');
    const files = Array.from(fileInput.files);
    const caption = captionInput.value.trim();
    if (!files.length) return;

    btn.disabled = true;
    statusEl.className = 'upload-status';
    statusEl.style.display = 'block';

    let done = 0;
    let failed = 0;

    function uploadNext(index) {
      if (index >= files.length) {
        btn.disabled = false;
        btn.textContent = 'Upload for Review';
        if (failed === 0) {
          statusEl.textContent = 'Uploaded ' + done + ' file(s) — now in "Pending review" below.';
          statusEl.classList.add('success');
          document.getElementById('uploadForm').reset();
        } else {
          statusEl.textContent = done + ' uploaded, ' + failed + ' failed. Check your connection and try again for the failed ones.';
        }
        return;
      }
      btn.textContent = 'Uploading ' + (index + 1) + ' of ' + files.length + '…';
      statusEl.textContent = 'Uploading file ' + (index + 1) + ' of ' + files.length + ' — this can take a moment for video…';

      uploadOneFile(files[index], caption)
        .then(function () { done++; })
        .catch(function () { failed++; })
        .finally(function () { uploadNext(index + 1); });
    }

    uploadNext(0);
  });

  // ---- Render helpers ----
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function renderPending(items) {
    const wrap = document.getElementById('pendingList');
    if (!items.length) {
      wrap.innerHTML = '<p class="empty-note">Nothing waiting for review right now.</p>';
      return;
    }
    wrap.innerHTML = items.map(function (item) {
      return '<div class="admin-item">' +
        '<div class="info"><p>' + escapeHtml(item.caption) + '</p>' +
        '<span class="meta">' + item.resourceType.toUpperCase() + '</span></div>' +
        '<div class="actions">' +
        '<button class="btn-sm btn-approve" data-approve="' + item.id + '">Approve</button>' +
        '<button class="btn-sm btn-reject" data-reject="' + item.id + '">Reject</button>' +
        '</div></div>';
    }).join('');

    wrap.querySelectorAll('[data-approve]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        db.collection('gallery').doc(btn.dataset.approve).update({ status: 'approved' });
      });
    });
    wrap.querySelectorAll('[data-reject]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (confirm('Reject and delete this item? This cannot be undone.')) {
          db.collection('gallery').doc(btn.dataset.reject).delete();
        }
      });
    });
  }

  function renderApproved(items) {
    const wrap = document.getElementById('approvedList');
    if (!items.length) {
      wrap.innerHTML = '<p class="empty-note">Nothing published yet.</p>';
      return;
    }
    wrap.innerHTML = items.map(function (item) {
      return '<div class="admin-item">' +
        '<div class="info"><p>' + escapeHtml(item.caption) + '</p>' +
        '<span class="meta">' + item.resourceType.toUpperCase() + ' — live on Our Work</span></div>' +
        '<div class="actions">' +
        '<button class="btn-sm btn-remove" data-remove="' + item.id + '">Remove from Site</button>' +
        '</div></div>';
    }).join('');

    wrap.querySelectorAll('[data-remove]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (confirm('Remove this from the public gallery?')) {
          db.collection('gallery').doc(btn.dataset.remove).delete();
        }
      });
    });
  }

  function startListeners() {
    db.collection('gallery').orderBy('createdAt', 'desc')
      .onSnapshot(function (snapshot) {
        const pending = [];
        const approved = [];
        snapshot.forEach(function (doc) {
          const item = Object.assign({ id: doc.id }, doc.data());
          if (item.status === 'approved') approved.push(item);
          else pending.push(item);
        });
        renderPending(pending);
        renderApproved(approved);
      }, function (err) {
        document.getElementById('pendingList').innerHTML =
          '<p class="empty-note">Could not load items: ' + err.message + '</p>';
      });
  }
</script>
</body>
