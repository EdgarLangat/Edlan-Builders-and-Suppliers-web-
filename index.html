<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edlan Builders and Suppliers | Building Together Our Future — Nakuru, Kenya</title>
<meta name="description" content="Edlan Builders and Suppliers — plot plans, architectural design, site plans, school plans, mansion design, building materials & delivery, and construction in Nakuru, Kenya.">
<link rel="icon" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   EDLAN BUILDERS AND SUPPLIERS — Stylesheet
   Design language: "blueprint & roofline" — drawn from the company logo's
   glazed roof-truss mark. Navy + magenta + construction-green + gold glass
   trim, set against warm blueprint-cream, with a mono "drafting" type used
   for plan dimensions and labels.
   ========================================================================== */

:root {
  /* ---- Color tokens (from the Edlan logo) ---- */
  --navy: #1b2a6e;
  --navy-dark: #0e1740;
  --magenta: #e0117a;
  --magenta-dark: #a80c5c;
  --green-start: #7ec242;
  --green-end: #dcefc0;
  --gold: #f0d675;
  --gold-soft: #f8e9ad;
  --sky: #56c6f5;
  --cream: #faf8f2;
  --cream-dim: #f1ede1;
  --charcoal: #171a20;
  --ink-soft: #4a4e57;
  --white: #ffffff;

  /* ---- Type ---- */
  --font-display: 'Poppins', 'Segoe UI', sans-serif;
  --font-body: 'Inter', 'Segoe UI', sans-serif;
  --font-mono: 'Roboto Mono', 'Courier New', monospace;

  /* ---- Layout ---- */
  --max-width: 1200px;
  --radius: 10px;
  --shadow-soft: 0 10px 30px rgba(14, 23, 64, 0.12);
  --shadow-glow: 0 0 24px rgba(240, 214, 117, 0.55);
}

* { box-sizing: border-box; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: var(--font-body);
  color: var(--charcoal);
  background: var(--cream);
  line-height: 1.6;
  overflow-x: hidden;
}

h1, h2, h3, h4 {
  font-family: var(--font-display);
  margin: 0 0 0.5em;
  line-height: 1.15;
  color: var(--navy);
}

p { margin: 0 0 1em; }

a { color: inherit; text-decoration: none; }

img { max-width: 100%; display: block; }

.container {
  width: 100%;
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0 24px;
}

.eyebrow {
  font-family: var(--font-mono);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-size: 0.75rem;
  color: var(--magenta);
  font-weight: 700;
  display: inline-block;
  margin-bottom: 10px;
}

.blueprint-tick {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--sky);
  opacity: 0.85;
}

/* ==========================================================================
   BUTTONS — glowing, glass-roof inspired
   ========================================================================== */

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 0.95rem;
  padding: 14px 28px;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
  white-space: nowrap;
}

.btn-primary {
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold-soft) 100%);
  color: var(--navy-dark);
  box-shadow: 0 0 0 rgba(240, 214, 117, 0);
}
.btn-primary:hover {
  box-shadow: var(--shadow-glow);
  transform: translateY(-2px);
}

.btn-outline {
  background: transparent;
  color: var(--white);
  border: 2px solid var(--sky);
  box-shadow: 0 0 0 rgba(86, 198, 245, 0);
}
.btn-outline:hover {
  box-shadow: 0 0 20px rgba(86, 198, 245, 0.6);
  transform: translateY(-2px);
}

.btn-magenta {
  background: linear-gradient(135deg, var(--magenta) 0%, var(--magenta-dark) 100%);
  color: var(--white);
}
.btn-magenta:hover {
  box-shadow: 0 0 22px rgba(224, 17, 122, 0.55);
  transform: translateY(-2px);
}

.btn-block { width: 100%; justify-content: center; }

/* ==========================================================================
   HEADER / NAV
   ========================================================================== */

.site-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 500;
  background: rgba(14, 23, 64, 0.72);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(240, 214, 117, 0.25);
  transition: background 0.3s ease;
}

.nav-wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 24px;
  max-width: var(--max-width);
  margin: 0 auto;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand img {
  height: 46px;
  width: auto;
  filter: drop-shadow(0 0 8px rgba(240, 214, 117, 0.45));
}
.brand-text {
  display: flex;
  flex-direction: column;
  line-height: 1.1;
}
.brand-text strong {
  font-family: var(--font-display);
  color: var(--white);
  font-size: 1.05rem;
  letter-spacing: 0.02em;
}
.brand-text span {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  color: var(--sky);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.nav-links {
  display: flex;
  gap: 30px;
  list-style: none;
  margin: 0;
  padding: 0;
}
.nav-links a {
  color: var(--white);
  font-weight: 500;
  font-size: 0.92rem;
  position: relative;
  padding: 6px 2px;
}
.nav-links a::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -2px;
  width: 0%;
  height: 2px;
  background: var(--gold);
  transition: width 0.25s ease;
}
.nav-links a:hover::after,
.nav-links a.active::after { width: 100%; }
.nav-links a.active { color: var(--gold); }

.nav-cta {
  display: flex;
  align-items: center;
  gap: 14px;
}
.nav-call {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--white);
  font-family: var(--font-mono);
  font-size: 0.85rem;
  border: 1px solid rgba(255,255,255,0.25);
  padding: 8px 14px;
  border-radius: 999px;
  transition: box-shadow 0.25s ease, border-color 0.25s ease;
}
.nav-call:hover {
  border-color: var(--sky);
  box-shadow: 0 0 14px rgba(86, 198, 245, 0.5);
}

.nav-toggle {
  display: none;
  flex-direction: column;
  gap: 5px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 6px;
}
.nav-toggle span {
  width: 26px;
  height: 2px;
  background: var(--white);
  border-radius: 2px;
}

@media (max-width: 900px) {
  .nav-links { display: none; }
  .nav-call span.call-label { display: none; }
  .nav-toggle { display: flex; }
  .nav-links.open {
    display: flex;
    flex-direction: column;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: var(--navy-dark);
    padding: 20px 24px;
    gap: 18px;
    border-bottom: 2px solid var(--gold);
  }
}

/* ==========================================================================
   HERO / SLIDESHOW
   ========================================================================== */

.hero {
  position: relative;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: var(--navy-dark);
}

.slideshow {
  position: absolute;
  inset: 0;
  z-index: 0;
}
.slide {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  opacity: 0;
  transition: opacity 1.6s ease-in-out;
}
.slide.active { opacity: 1; }

.hero-video {
  position: absolute;
  inset: 0;
  z-index: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.4;
  animation: heroVideoZoom 24s ease-in-out infinite alternate;
}
@keyframes heroVideoZoom {
  0% { transform: scale(1); }
  100% { transform: scale(1.08); }
}
@media (prefers-reduced-motion: reduce) {
  .hero-video { animation: none; }
}

.hero-overlay {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(180deg, rgba(14,23,64,0.72) 0%, rgba(14,23,64,0.55) 45%, rgba(14,23,64,0.92) 100%),
    repeating-linear-gradient(0deg, rgba(86,198,245,0.05) 0px, rgba(86,198,245,0.05) 1px, transparent 1px, transparent 40px),
    repeating-linear-gradient(90deg, rgba(86,198,245,0.05) 0px, rgba(86,198,245,0.05) 1px, transparent 1px, transparent 40px);
  z-index: 1;
}

.hero-content {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 160px 24px 90px;
  max-width: 880px;
}

.hero-logo {
  max-width: 300px;
  margin: 0 auto 28px;
  filter: drop-shadow(0 0 26px rgba(240, 214, 117, 0.65)) drop-shadow(0 0 50px rgba(86, 198, 245, 0.35));
  animation: logoFloat 5s ease-in-out infinite;
}

@keyframes logoFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.hero h1 {
  color: var(--white);
  font-size: clamp(2rem, 5vw, 3.4rem);
  font-weight: 700;
  margin-bottom: 14px;
}
.hero h1 em {
  font-style: italic;
  color: var(--gold);
  font-weight: 600;
}

.hero p.lead {
  color: #e7ecf7;
  font-size: 1.15rem;
  max-width: 640px;
  margin: 0 auto 34px;
}

.hero-actions {
  display: flex;
  gap: 18px;
  justify-content: center;
  flex-wrap: wrap;
}

.hero-scroll {
  position: absolute;
  bottom: 26px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  color: var(--sky);
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  opacity: 0.85;
}
.hero-scroll .chevron {
  width: 10px;
  height: 10px;
  border-right: 2px solid var(--sky);
  border-bottom: 2px solid var(--sky);
  transform: rotate(45deg);
  animation: chevronBounce 1.8s ease-in-out infinite;
}
@keyframes chevronBounce {
  0%, 100% { transform: rotate(45deg) translate(0,0); opacity: 0.4; }
  50% { transform: rotate(45deg) translate(4px,4px); opacity: 1; }
}

.slide-dots {
  position: absolute;
  bottom: 70px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  display: flex;
  gap: 10px;
}
.slide-dots button {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  border: 1px solid var(--gold);
  background: transparent;
  cursor: pointer;
  padding: 0;
  transition: background 0.3s ease, box-shadow 0.3s ease;
}
.slide-dots button.active {
  background: var(--gold);
  box-shadow: 0 0 10px rgba(240, 214, 117, 0.8);
}

/* ==========================================================================
   ROOFLINE DIVIDER — signature element (blueprint truss line)
   ========================================================================== */

.roofline {
  position: relative;
  z-index: 3;
  display: block;
  width: 100%;
  height: auto;
  margin-bottom: -2px;
}
.roofline.flip { transform: rotate(180deg); }

/* ==========================================================================
   SECTIONS (generic)
   ========================================================================== */

section { position: relative; }

.section {
  padding: 90px 0;
}
.section-cream { background: var(--cream); }
.section-dim { background: var(--cream-dim); }
.section-navy {
  background: linear-gradient(160deg, var(--navy-dark) 0%, var(--navy) 100%);
  color: var(--white);
}
.section-navy h2, .section-navy h3 { color: var(--white); }

.section-head {
  text-align: center;
  max-width: 720px;
  margin: 0 auto 56px;
}
.section-head h2 { font-size: clamp(1.7rem, 3.5vw, 2.4rem); }
.section-head p { color: var(--ink-soft); font-size: 1.05rem; }
.section-navy .section-head p { color: #d6def0; }

/* ==========================================================================
   SERVICES GRID
   ========================================================================== */

.services-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
  gap: 26px;
}

.service-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 32px 26px;
  box-shadow: var(--shadow-soft);
  border-top: 4px solid var(--gold);
  position: relative;
  overflow: hidden;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.service-card::before {
  content: "";
  position: absolute;
  top: -60px;
  right: -60px;
  width: 140px;
  height: 140px;
  background: radial-gradient(circle, rgba(86,198,245,0.18) 0%, transparent 70%);
  border-radius: 50%;
}
.service-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 16px 40px rgba(27, 42, 110, 0.2);
  border-top-color: var(--sky);
}
.service-icon {
  width: 54px;
  height: 54px;
  margin-bottom: 18px;
  color: var(--navy);
}
.service-card h3 {
  font-size: 1.1rem;
  margin-bottom: 10px;
}
.service-card p {
  color: var(--ink-soft);
  font-size: 0.94rem;
  margin-bottom: 0;
}
.service-tag {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  color: var(--magenta);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  display: block;
  margin-bottom: 8px;
}

.service-detail {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
  align-items: center;
  padding: 70px 0;
  border-bottom: 1px dashed rgba(27,42,110,0.15);
}
.service-detail:last-child { border-bottom: none; }
.service-detail.reverse .service-detail-media { order: 2; }
.service-detail-media {
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow-soft);
  position: relative;
  aspect-ratio: 4/3;
}
.service-detail-media img { width: 100%; height: 100%; object-fit: cover; }
.service-detail h3 { font-size: 1.5rem; }
.service-detail ul {
  padding-left: 20px;
  color: var(--ink-soft);
  margin: 18px 0 0;
}
.service-detail li { margin-bottom: 8px; }

@media (max-width: 800px) {
  .service-detail, .service-detail.reverse .service-detail-media {
    grid-template-columns: 1fr;
    order: 0;
  }
  .service-detail { grid-template-columns: 1fr; }
}

/* ==========================================================================
   PLACEHOLDER PHOTO BLOCKS (swap for real photography)
   ========================================================================== */

.photo-placeholder {
  width: 100%;
  height: 100%;
  min-height: 220px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 8px;
  color: var(--navy);
  font-family: var(--font-mono);
  font-size: 0.75rem;
  text-align: center;
  padding: 20px;
  background:
    linear-gradient(135deg, rgba(126,194,66,0.18), rgba(86,198,245,0.18)),
    repeating-linear-gradient(45deg, rgba(27,42,110,0.06) 0, rgba(27,42,110,0.06) 2px, transparent 2px, transparent 14px),
    var(--cream-dim);
}
.photo-placeholder svg { width: 40px; height: 40px; opacity: 0.6; }

/* ==========================================================================
   ABOUT / STATS
   ========================================================================== */

.about-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 60px;
  align-items: center;
}
@media (max-width: 860px) {
  .about-grid { grid-template-columns: 1fr; }
}

.stats-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 20px;
  margin-top: 34px;
}
.stat-box {
  text-align: center;
  padding: 18px 10px;
  border-left: 3px solid var(--gold);
}
.stat-box strong {
  display: block;
  font-family: var(--font-display);
  font-size: 1.9rem;
  color: var(--navy);
}
.section-navy .stat-box strong { color: var(--gold); }
.stat-box span {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-soft);
}
.section-navy .stat-box span { color: #cdd7ef; }

.process-steps {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 24px;
  counter-reset: step;
}
.process-step {
  position: relative;
  padding: 26px 22px 22px;
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: var(--shadow-soft);
}
.process-step::before {
  counter-increment: step;
  content: counter(step, decimal-leading-zero);
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: var(--white);
  background: var(--magenta);
  padding: 4px 10px;
  border-radius: 999px;
  display: inline-block;
  margin-bottom: 14px;
}

/* ==========================================================================
   TESTIMONIALS
   ========================================================================== */

.testimonial-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 24px;
}
.testimonial-card {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(240,214,117,0.25);
  border-radius: var(--radius);
  padding: 28px;
}
.testimonial-card p { font-style: italic; color: #eef1f8; }
.testimonial-name {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: var(--gold);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

/* ==========================================================================
   CONTACT
   ========================================================================== */

.contact-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 50px;
}
@media (max-width: 900px) {
  .contact-grid { grid-template-columns: 1fr; }
}

.contact-cards {
  display: grid;
  gap: 18px;
}
.contact-card {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  background: var(--white);
  padding: 22px;
  border-radius: var(--radius);
  box-shadow: var(--shadow-soft);
  border-left: 4px solid var(--sky);
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}
.contact-card:hover {
  transform: translateX(4px);
  box-shadow: 0 14px 34px rgba(27,42,110,0.18);
}
.contact-card .icon {
  width: 42px;
  height: 42px;
  flex-shrink: 0;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--green-start), var(--green-end));
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--navy-dark);
}
.contact-card .icon svg { width: 20px; height: 20px; }
.contact-card h4 { margin-bottom: 4px; font-size: 1rem; }
.contact-card p { margin-bottom: 0; color: var(--ink-soft); font-size: 0.94rem; }
.contact-card a.value {
  color: var(--navy);
  font-weight: 600;
  word-break: break-word;
}
.contact-card a.value:hover { color: var(--magenta); }

.map-wrap {
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow-soft);
  border: 3px solid var(--white);
  outline: 2px solid var(--gold-soft);
}
.map-wrap iframe {
  width: 100%;
  height: 320px;
  border: 0;
  display: block;
}

.contact-form {
  background: var(--white);
  padding: 34px;
  border-radius: var(--radius);
  box-shadow: var(--shadow-soft);
}
.form-row { margin-bottom: 18px; }
.form-row label {
  display: block;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--navy);
  margin-bottom: 6px;
}
.form-row input,
.form-row select,
.form-row textarea {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid #dfe2ea;
  border-radius: 8px;
  font-family: var(--font-body);
  font-size: 0.95rem;
  background: var(--cream);
  transition: border-color 0.25s ease, box-shadow 0.25s ease;
}
.form-row input:focus,
.form-row select:focus,
.form-row textarea:focus {
  outline: none;
  border-color: var(--sky);
  box-shadow: 0 0 0 4px rgba(86,198,245,0.18);
}
.form-note {
  font-size: 0.8rem;
  color: var(--ink-soft);
  margin-top: 10px;
  text-align: center;
}

/* ==========================================================================
   CTA BAND
   ========================================================================== */

.cta-band {
  background: linear-gradient(120deg, var(--green-start) 0%, var(--green-end) 100%);
  padding: 60px 0;
  text-align: center;
}
.cta-band h2 { color: var(--navy-dark); margin-bottom: 10px; }
.cta-band p { color: var(--navy-dark); opacity:
